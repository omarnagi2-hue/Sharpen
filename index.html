<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sharpen">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Sharpen: C1 vocabulary trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8FC; --card:#FFFFFF; --ink:#17203D; --ink-2:#4A5372; --ink-3:#8A91AB;
  --line:#E3E6F0; --line-2:#CDD2E2;
  --cobalt:#2F5BEA; --cobalt-dk:#1E44C2; --cobalt-tint:#E9EEFF;
  --sun:#FFCF3F; --sun-dk:#E0AE12;
  --mint:#1FB77A; --mint-dk:#158C5C; --mint-tint:#E3F8EF;
  --coral:#FF5C5C; --coral-dk:#D93B3B; --coral-tint:#FFE8E8;
  --r:18px; --r-sm:12px;
  --shadow-btn:0 4px 0 0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink); font-weight:600; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
html,body{height:100%;overflow:hidden;position:relative}
#app{position:absolute;top:0;left:0;right:0;height:var(--vvh,100%);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.kb-space{height:var(--kbres,0px)}
.inline-check{margin-top:10px;margin-bottom:16px}
.q-card .helpline{margin-top:8px}
.q-card .field{font-size:16px}
#app>.screen{max-width:480px;margin:0 auto}
.screen{padding:18px 18px 120px}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:16px;font-weight:800;font-size:17px;
  background:var(--cobalt);color:#fff;box-shadow:var(--shadow-btn) var(--cobalt-dk);
  transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 0 var(--cobalt-dk)}
.btn.ghost{background:#fff;color:var(--cobalt);box-shadow:0 4px 0 0 var(--line-2);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 0 var(--line-2)}
.btn.mint{background:var(--mint);box-shadow:0 4px 0 0 var(--mint-dk)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 0 var(--coral-dk)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 0 var(--sun-dk)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px;width:auto}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 0 var(--line-2)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn svg{width:22px;height:22px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;min-height:44px}
.topbar h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
.topbar .sub{font-size:14px;color:var(--ink-3);font-weight:700}
.bar-track{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--mint);border-radius:99px;transition:width .35s ease}
.bar-fill.cobalt{background:var(--cobalt)}

/* today card */
.today{
  background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:18px;
}
.today .big{font-size:40px;font-weight:900;line-height:1;display:flex;align-items:center;gap:8px}
.today .big svg{width:34px;height:34px}
.today .lbl{font-size:14px;color:#B9C1E0;font-weight:700;margin-top:4px}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .c1{fill:none;stroke:#3A4568;stroke-width:9}
.ring .c2{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .txt{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;text-align:center;line-height:1.1}
.ring .txt small{font-size:10px;color:#B9C1E0;font-weight:700}

.due-btn{margin-bottom:22px}

h2.sec{font-size:15px;color:var(--ink-3);font-weight:800;margin:14px 0 10px}

/* module cards */
.mods{display:flex;flex-direction:column;gap:12px}
.mod{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 14px;
  box-shadow:0 4px 0 0 var(--line-2);text-align:left;width:100%;
}
.mod:active{transform:translateY(4px);box-shadow:none}
.mod .badge{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.mod .name{font-weight:800;font-size:16px;line-height:1.2}
.mod .meta{font-size:13px;color:var(--ink-3);font-weight:700;margin-top:3px}
.mod .bar-track{height:8px;margin-top:8px}
.mod .pct{font-weight:900;font-size:18px;min-width:44px;text-align:right}
.mod.all .badge{background:var(--ink)}

/* module screen */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:14px;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.mode{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:800;box-shadow:0 3px 0 0 var(--line-2)}
.mode small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:700;margin-top:2px;line-height:1.3}
.mode.on{border-color:var(--cobalt);background:var(--cobalt-tint);box-shadow:0 3px 0 0 var(--cobalt)}
.stack{display:flex;flex-direction:column;gap:10px}
.wordlist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wrow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;font-size:15px;text-align:left;width:100%}
.wrow small{color:var(--ink-3);font-weight:700;font-size:12.5px;margin-left:8px}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--mint)}

/* flashcard */
.flash-wrap{perspective:1200px;margin:6px 0 16px}
.flash{
  position:relative;width:100%;min-height:500px;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer;
}
.flash.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 0 var(--line-2);
  padding:22px 20px;display:flex;flex-direction:column;overflow:auto;
}
.face.back{transform:rotateY(180deg)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:800;color:#fff;align-self:flex-start}
.front-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.term{font-size:40px;font-weight:900;letter-spacing:-.6px;line-height:1.05;word-break:break-word}
.ipa{font-size:17px;color:var(--ink-3);font-weight:700}
.speak{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--cobalt-tint);color:var(--cobalt);font-weight:800;font-size:15px}
.speak svg{width:20px;height:20px}
.hint{color:var(--ink-3);font-size:13px;font-weight:700;text-align:center}
/* the swap: generic vs C1 */
.swap{margin:12px 0 16px;padding:14px;border-radius:16px;background:var(--paper);border:2px dashed var(--line-2)}
.swap .from{color:var(--ink-3);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--coral);font-size:16px}
.swap .arrow{color:var(--ink-3);font-size:14px;font-weight:800;margin:3px 0}
.swap .to{font-size:26px;font-weight:900;color:var(--cobalt);line-height:1.1}
.def{font-size:16.5px;line-height:1.45;margin-bottom:12px}
.block{margin-bottom:12px}
.block .k{font-size:12.5px;color:var(--ink-3);font-weight:800;margin-bottom:3px}
.block .v{font-size:15px;line-height:1.45}
.block .v em{font-style:italic;color:var(--ink-2)}
.colls{display:flex;flex-wrap:wrap;gap:6px}
.coll{padding:5px 10px;border-radius:9px;background:var(--cobalt-tint);color:var(--cobalt-dk);font-size:13.5px;font-weight:800}
.assess{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* practice */
.q-card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 5px 0 0 var(--line-2);margin-bottom:14px}
.q-type{font-size:13px;color:var(--ink-3);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.q-type .tag{font-size:11.5px;padding:3px 9px}
.q-prompt{font-size:19px;font-weight:800;line-height:1.35;margin-bottom:12px}
.q-basic{font-size:18px;line-height:1.45;padding:14px;border-radius:14px;background:var(--paper);border:2px solid var(--line);margin-bottom:12px}
.q-basic b{background:#FFF1BF;padding:0 3px;border-radius:4px}
.gap{display:inline-block;min-width:78px;border-bottom:3px solid var(--cobalt);color:var(--cobalt);text-align:center;font-weight:900;padding:0 6px}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px;font-weight:700;background:#fff;resize:none;min-height:54px;line-height:1.4}
.field:focus{border-color:var(--cobalt);outline:none}
.field.ok{border-color:var(--mint);background:var(--mint-tint)}
.field.bad{border-color:var(--coral);background:var(--coral-tint)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px;box-shadow:0 3px 0 0 var(--line-2);display:flex;align-items:center;gap:12px}
.opt .key{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink-3);flex:none}
.opt.sel{border-color:var(--cobalt);background:var(--cobalt-tint);box-shadow:0 3px 0 0 var(--cobalt)}
.opt.ok{border-color:var(--mint);background:var(--mint-tint);box-shadow:0 3px 0 0 var(--mint)}
.opt.bad{border-color:var(--coral);background:var(--coral-tint);box-shadow:0 3px 0 0 var(--coral)}
.opt[disabled]{cursor:default}
.helpline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{padding:6px 11px;border-radius:99px;background:var(--paper);border:2px solid var(--line);font-size:13px;font-weight:800;color:var(--ink-2)}

/* bottom action bar */
.dock{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:5;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--line)}
.dock-in{max-width:480px;margin:0 auto}
/* feedback sheet */
.feedback{position:fixed;left:0;right:0;bottom:var(--kb,0px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:20}
.feedback.show{transform:translateY(0)}
.fb-in{max-width:480px;margin:0 auto;padding:18px 18px calc(16px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0}
.feedback.ok .fb-in{background:var(--mint-tint);color:var(--mint-dk)}
.feedback.bad .fb-in{background:var(--coral-tint);color:var(--coral-dk)}
.fb-title{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb-title svg{width:26px;height:26px}
.fb-body{color:var(--ink);font-size:15px;line-height:1.45;margin-bottom:12px;max-height:38vh;overflow:auto}
.fb-body p{margin-bottom:8px}
.fb-body .model{padding:10px 12px;background:#fff;border-radius:12px;font-weight:700;border:2px solid rgba(0,0,0,.06)}
.fb-body .model b{color:var(--cobalt)}
.feedback.ok .btn{background:var(--mint);box-shadow:0 4px 0 0 var(--mint-dk)}
.feedback.bad .btn{background:var(--coral);box-shadow:0 4px 0 0 var(--coral-dk)}

/* summary */
.summary{text-align:center;padding-top:30px}
.summary .score{font-size:64px;font-weight:900;color:var(--cobalt);line-height:1}
.summary .lbl{color:var(--ink-3);font-weight:800;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 8px}
.stat .n{font-size:26px;font-weight:900}
.stat .l{font-size:12.5px;color:var(--ink-3);font-weight:800}
.review-list{text-align:left;display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.review-list .wrow{font-size:15px}
.review-list .wrow.bad{border-color:var(--coral-tint);background:#FFF6F6}
.review-list .wrow.ok{border-color:var(--mint-tint);background:#F4FCF8}

/* settings */
.setrow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.seg{display:flex;gap:4px;background:var(--paper);padding:3px;border-radius:10px;border:2px solid var(--line)}
.seg button{padding:6px 12px;border-radius:7px;font-weight:800;font-size:14px;color:var(--ink-3)}
.seg button.on{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--ink-3);padding:30px 10px;font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.intro{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15.5px;line-height:1.55;color:var(--ink-2);margin-bottom:12px}
.ask{background:var(--cobalt-tint);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5;color:var(--cobalt);font-weight:800;margin-bottom:14px}
.ask small{display:block;font-size:12px;color:var(--ink-3);font-weight:800;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.seg2{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;padding:9px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line-2)}
.ladder{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%}
.lrow.cur{border-color:var(--cobalt);background:var(--cobalt-tint)}
.lrow .lv{display:flex;flex-direction:column-reverse;gap:2px;width:14px;flex:none}
.lrow .lv i{display:block;height:5px;border-radius:2px;background:var(--line)}
.lrow .lv i.on{background:var(--cobalt)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:16.5px;color:var(--ink)}
.lrow .tx span{display:block;font-size:13.5px;color:var(--ink-3);font-weight:700;line-height:1.35;margin-top:2px}
.lrow .dots{flex:none}
.kind{margin:14px 0 8px;font-size:13.5px;font-weight:800;color:var(--ink-2);padding-left:2px}
.kind small{display:block;color:var(--ink-3);font-weight:700;font-size:12.5px}
.dom{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.dom .sw{width:10px;height:10px;border-radius:3px}
.crow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;text-align:left;font-weight:800;font-size:15.5px;box-shadow:0 3px 0 0 var(--line-2)}
.crow small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:700;margin-top:2px}
.crow .pct{font-size:13px;color:var(--ink-3);margin-left:10px;flex:none}
.wordhead{background:var(--ink);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.wordhead .term{font-size:30px;font-weight:900;letter-spacing:-.02em}
.wordhead .ipa{color:#B9C3E6;font-size:15px;margin:4px 0 10px}
.wordhead .speak{background:rgba(255,255,255,.14);color:#fff}
.sit{font-size:17px;line-height:1.5;padding:14px;border-radius:14px;background:var(--paper);border:2px solid var(--line);margin-bottom:12px}
.sit small{display:block;font-size:12px;color:var(--ink-3);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="fb" class="feedback"><div class="fb-in" id="fb-in"></div></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   DATA: modules and the C1 vocabulary database
   Each entry: t term, m module index, s sub-category,
   b basic equivalent, d definition, n nuance, p IPA,
   e example sentence, c collocations,
   bs basic (B1/B2) sentence, cs C1 model sentence,
   f accepted forms (inflections) for answer checking,
   x near-synonyms to exclude as multiple-choice distractors
   ========================================================= */
const MODULES = [
  {id:"verbs", name:"Manner-specific verbs", short:"Verbs", hue:"#2F5BEA", subs:["Movement","Speech","Sight","Emotion","Action"]},
  {id:"adj",   name:"Extreme & precise adjectives", short:"Adjectives", hue:"#F2762E", subs:["Temperature & weather","Feelings","Size & degree","Quality"]},
  {id:"nouns", name:"Precise nouns & nuances", short:"Nouns", hue:"#8B4DD6", subs:["Groups & quantities","Sounds & weather","Things & events","Feelings"]},
  {id:"coll",  name:"Collocations & binomials", short:"Collocations", hue:"#139E8C", subs:["Binomial expressions","Adjective + noun","Verb + noun"]},
  {id:"phr",   name:"Phrasal verbs with manner", short:"Phrasal verbs", hue:"#E23D7A", subs:["Speed & ease","Force & intrusion","Avoidance & withdrawal"]}
];

const CONCEPTS = [
// ---------------- FEELINGS ----------------
{id:"hate",dom:"Feelings",title:"Dislike and hatred",
intro:"Plain 'hate' tells the listener nothing about what the hatred is made of. In English the strong words for dislike are separated less by strength than by kind: whether the feeling is disgust in the body, contempt in the mind, or bitterness about being treated unfairly. Choosing the word is choosing which of these you mean.",
ask:"Is it about what they are like (loathe), about their worth (despise), or about what they did to you (resent)?",
scale:"How strong",kinds:{disgust:"Disgust: a gut reaction, you cannot stand it",contempt:"Contempt: looking down, they are beneath you",unfair:"Injustice: bitterness about how you were treated"},
w:[["loathe",5,"disgust","strong dislike that feels physical, like nausea"],["despise",4,"contempt","you have no respect for them at all"],["contempt",4,"contempt","the noun: treating someone as worthless"],["resent",3,"unfair","bitter about a specific unfair thing, usually silently"],["resentment",3,"unfair","the noun: bitterness that lasts and is rarely spoken"],["grudge",3,"unfair","resentment aimed at one person, kept for a long time"]]},

{id:"anger",dom:"Feelings",title:"Anger, from irritated to livid",
intro:"Anger has a clear strength scale in English, but it also splits by visibility: is it boiling inside you, or bursting out at someone? Several words describe the same heat with different behaviour attached.",
ask:"How hot is it, and can other people see it?",
scale:"How strong",kinds:{inside:"Kept inside: the anger is felt but controlled",out:"Let out: the anger is aimed at someone"},

{"t":"scorching","m":1,"s":"Temperature & weather","b":"very hot","d":"extremely hot, burning","n":"Oppressive heat that can damage: sun, summer afternoons, deserts.","p":"/ˈskɔːtʃɪŋ/","e":"We hid indoors during the scorching afternoon.","c":["scorching heat","scorching sun","a scorching summer"],"bs":"It was very hot in the desert at noon.","cs":"It was scorching in the desert at noon.","f":["scorching"]},
{"t":"exhausted","m":1,"s":"Feelings","b":"very tired","d":"completely drained of energy","n":"Total tiredness after effort. Often 'utterly exhausted'.","p":"/ɪɡˈzɔːstɪd/","e":"After the night shift, she was utterly exhausted.","c":["utterly exhausted","physically exhausted","emotionally exhausted"],"bs":"He was very tired after the marathon.","cs":"He was exhausted after the marathon.","f":["exhausted"],"x":["drained"]},
{"t":"drained","m":1,"s":"Feelings","b":"very tired, emotionally","d":"having no energy left, especially emotionally","n":"Emotional depletion rather than physical effort: after grief, stress or a hard conversation.","p":"/dreɪnd/","e":"The funeral left everyone feeling drained.","c":["emotionally drained","feel drained"],"bs":"After the difficult conversation she felt very tired inside.","cs":"After the difficult conversation she felt drained.","f":["drained"],"x":["exhausted"]},
{"t":"ravenous","m":1,"s":"Feelings","b":"very hungry","d":"extremely hungry","n":"Animal-like hunger: you could eat anything.","p":"/ˈrævənəs/","e":"We were ravenous after the hike.","c":["absolutely ravenous","a ravenous appetite"],"bs":"We were very hungry after swimming all afternoon.","cs":"We were ravenous after swimming all afternoon.","f":["ravenous"]},
{"t":"furious","m":1,"s":"Feelings","b":"very angry","d":"extremely angry","n":"Explosive, open anger. The standard C1 upgrade for 'very angry'.","p":"/ˈfjʊəriəs/","e":"She was furious when she saw the bill.","c":["absolutely furious","furious with somebody","furious at something"],"bs":"Dad was very angry about the broken window.","cs":"Dad was furious about the broken window.","f":["furious"],"x":["livid"]},
{"t":"livid","m":1,"s":"Feelings","b":"very angry","d":"extremely angry, so angry your face changes colour","n":"More informal and story-telling than furious. 'He was absolutely livid.'","p":"/ˈlɪvɪd/","e":"He was livid when the flight was cancelled.","c":["absolutely livid"],"bs":"My boss was very, very angry about the missed deadline.","cs":"My boss was livid about the missed deadline.","f":["livid"],"x":["furious"]},
{"t":"petrified","m":1,"s":"Feelings","b":"very frightened","d":"so frightened you cannot move","n":"Frozen fear, literally 'turned to stone'. Often with 'of'.","p":"/ˈpetrɪfaɪd/","e":"I'm petrified of spiders.","c":["petrified of","absolutely petrified"],"bs":"She was very frightened of the dark as a child.","cs":"She was petrified of the dark as a child.","f":["petrified"]},
{"t":"minute","m":1,"s":"Size & degree","b":"very small","d":"extremely small; tiny in detail","n":"Precise and formal. Note the pronunciation: it is not the unit of time. 'In minute detail.'","p":"/maɪˈnjuːt/","e":"There was a minute crack in the glass.","c":["minute detail","a minute amount","minute traces of"],"bs":"There was a very small amount of dust on the lens.","cs":"There was a minute amount of dust on the lens.","f":["minute"]},
{"t":"colossal","m":1,"s":"Size & degree","b":"very big","d":"extremely large or great","n":"Awe-inspiring scale. Also used for mistakes, costs and waste.","p":"/kəˈlɒsl/","e":"The project was a colossal waste of money.","c":["a colossal mistake","a colossal amount","a colossal statue"],"bs":"They spent a very big amount of money on the wedding.","cs":"They spent a colossal amount on the wedding.","f":["colossal"]},
{"t":"spotless","m":1,"s":"Quality","b":"very clean","d":"completely clean, without a single mark","n":"Perfection. Also used of reputations and records.","p":"/ˈspɒtləs/","e":"Her kitchen is always spotless.","c":["a spotless kitchen","a spotless reputation","a spotless record"],"bs":"The hotel room was very clean.","cs":"The hotel room was spotless.","f":["spotless"]},
{"t":"exquisite","m":1,"s":"Quality","b":"very beautiful","d":"extremely beautiful and delicate","n":"Refinement and craftsmanship: jewellery, embroidery, taste. Not for landscapes or people's faces.","p":"/ɪkˈskwɪzɪt/","e":"She wore an exquisite silver necklace.","c":["exquisite craftsmanship","exquisite taste","exquisite detail"],"bs":"The embroidery on the dress was very beautiful.","cs":"The embroidery on the dress was exquisite.","f":["exquisite"]},
{"t":"hilarious","m":1,"s":"Quality","b":"very funny","d":"extremely funny","n":"Laugh-out-loud funny. Often 'absolutely hilarious'.","p":"/hɪˈleəriəs/","e":"His impression of the manager was hilarious.","c":["absolutely hilarious"],"bs":"The comedian's new show was very funny.","cs":"The comedian's new show was hilarious.","f":["hilarious"]},
{"t":"deafening","m":1,"s":"Quality","b":"very loud","d":"so loud that you cannot hear anything else","n":"Overwhelming noise. Also the ironic 'deafening silence'.","p":"/ˈdefənɪŋ/","e":"The applause was deafening.","c":["a deafening noise","a deafening roar","a deafening silence"],"bs":"The music at the concert was very loud.","cs":"The music at the concert was deafening.","f":["deafening"]},
{"t":"throng","m":2,"s":"Groups & quantities","b":"a big crowd","d":"a large, densely packed crowd","n":"Movement and pressure: streets, festivals, fans. Slightly literary.","p":"/θrɒŋ/","e":"A throng of fans waited outside the stadium.","c":["a throng of","throngs of tourists"],"bs":"A big crowd of shoppers filled the street before Christmas.","cs":"A throng of shoppers filled the street before Christmas.","f":["throng","throngs"]},
{"t":"handful","m":2,"s":"Groups & quantities","b":"a small number","d":"a small number of people or things","n":"Fewer than expected or hoped for. 'Only a handful of...'","p":"/ˈhændfʊl/","e":"Only a handful of students turned up.","c":["a handful of","only a handful"],"bs":"Only a small number of people came to the meeting.","cs":"Only a handful of people came to the meeting.","f":["handful"]},
{"t":"bite","m":2,"s":"Groups & quantities","b":"a small, quick meal","d":"a small, quick meal or snack","n":"Informal and casual: 'grab a bite'.","p":"/baɪt/","e":"Let's grab a bite before the film.","c":["grab a bite","a bite to eat"],"bs":"Let's have a small quick meal before the train.","cs":"Let's grab a bite before the train.","f":["bite"]},
{"t":"feast","m":2,"s":"Groups & quantities","b":"a big meal","d":"a large, elaborate meal, often for a celebration","n":"Abundance and celebration. Also 'a feast for the eyes'.","p":"/fiːst/","e":"Grandma prepared a feast for the whole family.","c":["a feast of","a wedding feast","a feast for the eyes"],"bs":"They cooked a big special meal for the reunion.","cs":"They cooked a feast for the reunion.","f":["feast"]},
{"t":"downpour","m":2,"s":"Sounds & weather","b":"heavy rain","d":"a heavy, sudden fall of rain","n":"Sudden and intense, usually short-lived. You get 'caught in a downpour'.","p":"/ˈdaʊnpɔː/","e":"We were caught in a downpour on the way home.","c":["a sudden downpour","a torrential downpour","caught in a downpour"],"bs":"We got soaked in the heavy rain after lunch.","cs":"We got soaked in the downpour after lunch.","f":["downpour"]},
{"t":"hush","m":2,"s":"Sounds & weather","b":"a sudden silence","d":"a sudden silence, especially in a crowd","n":"Expectant or respectful. 'A hush fell over the room.'","p":"/hʌʃ/","e":"A hush fell over the courtroom.","c":["a hush fell over","a hushed silence"],"bs":"There was a sudden silence in the theatre when the lights went down.","cs":"A hush fell over the theatre when the lights went down.","f":["hush"]},
{"t":"roar","m":2,"s":"Sounds & weather","b":"a loud, deep noise","d":"a loud, deep, prolonged sound","n":"Power: engines, crowds, waterfalls, lions.","p":"/rɔː/","e":"The roar of the engines drowned out our voices.","c":["the roar of the crowd","the roar of the engine","the roar of traffic"],"bs":"The loud noise of the waterfall made talking impossible.","cs":"The roar of the waterfall made talking impossible.","f":["roar"]},
{"t":"glimmer","m":2,"s":"Things & events","b":"a small amount of hope or light","d":"a faint sign of something; a faint, unsteady light","n":"Fragile and barely there. 'A glimmer of hope' is the classic collocation.","p":"/ˈɡlɪmə/","e":"There is still a glimmer of hope for the talks.","c":["a glimmer of hope","a glimmer of light","a glimmer of understanding"],"bs":"There was a small amount of hope that the deal would survive.","cs":"There was a glimmer of hope that the deal would survive.","f":["glimmer"]},
{"t":"flaw","m":2,"s":"Things & events","b":"a small problem or weakness","d":"a defect or weakness that spoils something","n":"The thing is otherwise good. Used of plans, arguments, products and characters.","p":"/flɔː/","e":"The plan had one fatal flaw.","c":["a fatal flaw","a serious flaw","a flaw in the argument"],"bs":"There was a small problem in the design that made it fail.","cs":"There was a flaw in the design that made it fail.","f":["flaw","flaws"]},
{"t":"spree","m":2,"s":"Things & events","b":"a short period of doing a lot of something","d":"a short period of intense, unrestrained activity","n":"Excess and lack of control: shopping, spending, crime.","p":"/spriː/","e":"She went on a shopping spree with her bonus.","c":["a shopping spree","a spending spree","a crime spree"],"bs":"He spent a lot of money in a short period on clothes.","cs":"He went on a spending spree on clothes.","f":["spree"]},
{"t":"surge","m":2,"s":"Things & events","b":"a sudden big increase","d":"a sudden, powerful increase or forward movement","n":"Force and momentum: prices, demand, emotion, crowds.","p":"/sɜːdʒ/","e":"There was a surge of interest after the film came out.","c":["a surge in","a surge of","a sudden surge"],"bs":"There was a sudden big increase in demand for tickets.","cs":"There was a surge in demand for tickets.","f":["surge"]},
{"t":"grudge","m":2,"s":"Feelings","b":"lasting anger about a past wrong","d":"a persistent feeling of resentment about a past wrong","n":"Long-term and deliberately kept alive: you 'hold' or 'bear' a grudge.","p":"/ɡrʌdʒ/","e":"He still holds a grudge against his old boss.","c":["hold a grudge against","bear a grudge"],"bs":"She has stayed angry with her sister for years about the will.","cs":"She has held a grudge against her sister for years about the will.","f":["grudge"]},
{"t":"back and forth","m":3,"s":"Binomial expressions","b":"from one side to the other, repeatedly","d":"moving first one way and then the other, repeatedly","n":"Repetition and indecision: negotiations, arguments, pacing. The word order is fixed.","p":"/bæk ən ˈfɔːθ/","e":"They went back and forth on the price for an hour.","c":["go back and forth","back-and-forth negotiations"],"bs":"They moved from one side to the other repeatedly for an hour.","cs":"They went back and forth for an hour.","f":["back and forth"]},
{"t":"pros and cons","m":3,"s":"Binomial expressions","b":"advantages and disadvantages","d":"the arguments for and against something","n":"Balanced decision-making. You 'weigh up' the pros and cons.","p":"/prəʊz ən kɒnz/","e":"We weighed up the pros and cons of moving abroad.","c":["weigh up the pros and cons","the pros and cons of"],"bs":"We discussed the advantages and disadvantages of the offer.","cs":"We discussed the pros and cons of the offer.","f":["pros and cons"]},
{"t":"sooner or later","m":3,"s":"Binomial expressions","b":"eventually","d":"at some point in the future, certainly","n":"Inevitability, often with a hint of warning.","p":"/ˈsuːnər ɔː ˈleɪtə/","e":"Sooner or later, they'll find out.","c":["sooner or later + will"],"bs":"Eventually, the truth will come out.","cs":"Sooner or later, the truth will come out.","f":["sooner or later"]},
{"t":"by and large","m":3,"s":"Binomial expressions","b":"generally speaking","d":"on the whole; in most respects","n":"A summarising phrase, slightly formal. Usually at the start of a sentence.","p":"/baɪ ən lɑːdʒ/","e":"By and large, the feedback was positive.","c":["by and large + general statement"],"bs":"Generally speaking, the reviews were good.","cs":"By and large, the reviews were good.","f":["by and large"]},
{"t":"safe and sound","m":3,"s":"Binomial expressions","b":"unharmed","d":"completely safe and unhurt","n":"Relief after worry: someone arrives or is found safe and sound.","p":"/seɪf ən saʊnd/","e":"The hikers were found safe and sound.","c":["arrive safe and sound","return safe and sound"],"bs":"The children arrived home unharmed.","cs":"The children arrived home safe and sound.","f":["safe and sound"]},
{"t":"crystal clear","m":3,"s":"Adjective + noun","b":"very clear","d":"completely clear and easy to understand; perfectly transparent","n":"Emphatic, sometimes stern: 'Let me make this crystal clear.'","p":"/ˈkrɪstl klɪə/","e":"Let me make this crystal clear: no phones in the exam.","c":["make something crystal clear","crystal clear water"],"bs":"The instructions were very clear.","cs":"The instructions were crystal clear.","f":["crystal clear"]},
{"t":"a heated debate","m":3,"s":"Adjective + noun","b":"an angry discussion","d":"a discussion in which people become angry and excited","n":"Passion and tension. Debates are 'sparked' or 'provoked'.","p":"/ə ˈhiːtɪd dɪˈbeɪt/","e":"The proposal sparked a heated debate.","c":["spark a heated debate","provoke a heated debate"],"bs":"The new law caused an angry discussion in parliament.","cs":"The new law sparked a heated debate in parliament.","f":["heated debate","heated debates"]},
{"t":"a vested interest","m":3,"s":"Adjective + noun","b":"a personal reason to want something to happen","d":"a personal stake in an outcome, often financial","n":"Carries suspicion of bias: someone with a vested interest cannot be neutral.","p":"/ə ˈvestɪd ˈɪntrəst/","e":"He has a vested interest in the merger going ahead.","c":["have a vested interest in"],"bs":"She has a personal reason to want the project approved.","cs":"She has a vested interest in the project being approved.","f":["vested interest","vested interests"]},
{"t":"make a concerted effort","m":3,"s":"Verb + noun","b":"try hard, together","d":"to make a determined, coordinated attempt","n":"Deliberate and usually collective. Teams and governments make concerted efforts.","p":"/meɪk ə kənˈsɜːtɪd ˈefət/","e":"The team made a concerted effort to cut costs.","c":["make a concerted effort to"],"bs":"The staff tried very hard together to reduce waste.","cs":"The staff made a concerted effort to reduce waste.","f":["concerted effort"]},
{"t":"strike a balance","m":3,"s":"Verb + noun","b":"find a middle way","d":"to find a satisfactory compromise between two things","n":"Careful judgement between competing demands: work and family, speed and quality.","p":"/straɪk ə ˈbæləns/","e":"It's hard to strike a balance between work and family.","c":["strike a balance between"],"bs":"We need to find a middle way between speed and quality.","cs":"We need to strike a balance between speed and quality.","f":["strike a balance","struck a balance","striking a balance","strikes a balance","strike the right balance"]},
{"t":"bear in mind","m":3,"s":"Verb + noun","b":"remember and consider","d":"to remember and consider something when deciding","n":"A gentle reminder, often followed by 'that'.","p":"/beər ɪn maɪnd/","e":"Bear in mind that the office closes at four.","c":["bear in mind that","bear something in mind"],"bs":"Remember that the shops close early on Sundays.","cs":"Bear in mind that the shops close early on Sundays.","f":["bear in mind","bore in mind","bearing in mind","bear that in mind","bear it in mind"]},
{"t":"draw a conclusion","m":3,"s":"Verb + noun","b":"decide what something means","d":"to decide something after considering the evidence","n":"Reasoning, formal register. Conclusions are drawn 'from' evidence.","p":"/drɔː ə kənˈkluːʒn/","e":"It is too early to draw a conclusion from the results.","c":["draw a conclusion from","draw conclusions"],"bs":"It is too early to decide what the results mean.","cs":"It is too early to draw a conclusion from the results.","f":["draw a conclusion","draw conclusions","drew a conclusion","drawn a conclusion","draw any conclusions","draw any conclusion"]},
{"t":"breeze through","m":4,"s":"Speed & ease","b":"do something easily","d":"to complete something with no difficulty at all","n":"Effortless, sometimes to the surprise of others: exams, interviews, tasks.","p":"/briːz θruː/","e":"She breezed through the interview.","c":["breeze through an exam","breeze through an interview"],"bs":"She passed the driving test very easily.","cs":"She breezed through the driving test.","f":["breezed through","breezes through","breezing through"]},
{"t":"plough through","m":4,"s":"Speed & ease","b":"do something slowly and with effort","d":"to work slowly through something long and tedious","n":"Effort, boredom and persistence: reports, paperwork, long books.","p":"/plaʊ θruː/","e":"I ploughed through the 300-page report over the weekend.","c":["plough through a report","plough through paperwork"],"bs":"He read the long contract slowly and with great effort.","cs":"He ploughed through the long contract.","f":["ploughed through","plowed through","ploughing through","plow through","ploughs through"]},
{"t":"dash off","m":4,"s":"Speed & ease","b":"write something very quickly","d":"to write or produce something very quickly and without much care","n":"Haste and low effort: notes, emails, replies.","p":"/dæʃ ɒf/","e":"She dashed off a quick reply and ran for the bus.","c":["dash off a note","dash off an email","dash off a reply"],"bs":"She wrote a quick reply and ran to catch the bus.","cs":"She dashed off a reply and ran to catch the bus.","f":["dashed off","dashes off","dashing off"]},
{"t":"rattle off","m":4,"s":"Speed & ease","b":"say a list quickly from memory","d":"to say or recite something rapidly and easily","n":"Fluent and practised: names, numbers, facts.","p":"/ˈrætl ɒf/","e":"He rattled off all fifty state capitals in a minute.","c":["rattle off a list","rattle off names","rattle off figures"],"bs":"He said all fifty state capitals quickly from memory.","cs":"He rattled off all fifty state capitals.","f":["rattled off","rattles off","rattling off"]},
{"t":"plod along","m":4,"s":"Speed & ease","b":"continue slowly and steadily","d":"to move or progress slowly and steadily, without excitement","n":"Dull but persistent: projects, careers, economies.","p":"/plɒd əˈlɒŋ/","e":"The project plodded along for years without much progress.","c":["plod along with a project"],"bs":"The project continued slowly and steadily without much progress.","cs":"The project plodded along without much progress.","f":["plodded along","plods along","plodding along"]},
{"t":"barge in","m":4,"s":"Force & intrusion","b":"enter rudely and suddenly","d":"to enter a room or conversation rudely and abruptly","n":"Rudeness and lack of awareness. Often 'barge in on' someone.","p":"/bɑːdʒ ɪn/","e":"He barged in on the meeting without knocking.","c":["barge in on somebody","barge into a room"],"bs":"He entered the meeting rudely without knocking.","cs":"He barged in on the meeting without knocking.","f":["barged in","barges in","barging in","barged into","barge into"]},
{"t":"storm out","m":4,"s":"Force & intrusion","b":"leave angrily","d":"to leave a place suddenly and angrily","n":"Dramatic, visible anger.","p":"/stɔːm aʊt/","e":"She stormed out of the meeting in tears.","c":["storm out of a meeting","storm out of the room"],"bs":"She left the room angrily in the middle of the argument.","cs":"She stormed out in the middle of the argument.","f":["stormed out","storms out","storming out"]},
{"t":"butt in","m":4,"s":"Force & intrusion","b":"interrupt rudely","d":"to interrupt a conversation rudely","n":"Informal; the speaker is annoyed, or apologising for doing it.","p":"/bʌt ɪn/","e":"Sorry to butt in, but is that seat taken?","c":["butt in on a conversation"],"bs":"Sorry to interrupt rudely, but is that seat taken?","cs":"Sorry to butt in, but is that seat taken?","f":["butt in","butted in","butts in","butting in"]},
{"t":"lash out","m":4,"s":"Force & intrusion","b":"attack suddenly, with words or blows","d":"to suddenly attack someone with words or physically","n":"Uncontrolled anger, often at the wrong target.","p":"/læʃ aʊt/","e":"She lashed out at her critics online.","c":["lash out at somebody"],"bs":"She suddenly attacked her critics angrily on social media.","cs":"She lashed out at her critics on social media.","f":["lashed out","lashes out","lashing out"]},
{"t":"wolf down","m":4,"s":"Force & intrusion","b":"eat very fast","d":"to eat something very quickly and greedily","n":"Hunger and hurry. Informal.","p":"/wʊlf daʊn/","e":"He wolfed down his lunch at his desk.","c":["wolf down a sandwich","wolf down breakfast"],"bs":"He ate his breakfast very fast and left.","cs":"He wolfed down his breakfast and left.","f":["wolfed down","wolfs down","wolfing down"]},
{"t":"slip away","m":4,"s":"Avoidance & withdrawal","b":"leave quietly without being noticed","d":"to leave quietly without anyone noticing","n":"Discretion or avoidance. Also used of time and opportunities that slip away.","p":"/slɪp əˈweɪ/","e":"He slipped away before the speeches started.","c":["slip away from a party","slip away unnoticed"],"bs":"She left the party quietly without anyone noticing.","cs":"She slipped away from the party unnoticed.","f":["slipped away","slips away","slipping away"]},
{"t":"shy away from","m":4,"s":"Avoidance & withdrawal","b":"avoid something because of nervousness","d":"to avoid something through nervousness or lack of confidence","n":"Reluctance and timidity: confrontation, responsibility, the spotlight.","p":"/ʃaɪ əˈweɪ frɒm/","e":"Politicians tend to shy away from that question.","c":["shy away from confrontation","shy away from responsibility"],"bs":"He avoids difficult conversations because they make him nervous.","cs":"He shies away from difficult conversations.","f":["shies away from","shied away from","shying away from","shy away from"]},
{"t":"creep","m":0,"s":"Movement","b":"move slowly and quietly","d":"to move slowly and carefully to avoid being noticed","n":"Secrecy or fear. Often used of things that approach gradually (doubt crept in).","p":"/kriːp/","e":"She crept downstairs so as not to wake the baby.","c":["creep up on someone","creep along","creep in"],"bs":"He moved slowly and quietly into the room.","cs":"He crept into the room.","f":["crept","creeping","creeps"],"x":["tiptoe","sneak"]},
{"t":"sneak","m":0,"s":"Movement","b":"go somewhere secretly","d":"to move quietly and secretly so as not to be seen","n":"The focus is on not being caught, often doing something mildly forbidden.","p":"/sniːk/","e":"They sneaked out of the lecture halfway through.","c":["sneak out","sneak in","sneak past"],"bs":"The teenagers left the house secretly at midnight.","cs":"The teenagers sneaked out at midnight.","f":["sneaked","snuck","sneaking","sneaks"],"x":["creep","tiptoe","slip away"]},
{"t":"stroll","m":0,"s":"Movement","b":"walk in a relaxed way","d":"to walk in a leisurely way for pleasure","n":"No hurry and no purpose beyond enjoying the walk. Warmer and more ordinary than saunter.","p":"/strəʊl/","e":"We strolled along the river after dinner.","c":["stroll along","take a stroll","stroll through"],"bs":"We walked slowly and happily around the old town.","cs":"We strolled around the old town.","f":["strolled","strolling","strolls"],"x":["saunter","amble","wander"]},
{"t":"amble","m":0,"s":"Movement","b":"walk slowly and easily","d":"to walk at a slow, relaxed pace","n":"Even slower than stroll; slightly literary. Often of older people or animals.","p":"/ˈæmbl/","e":"The old dog ambled over to greet us.","c":["amble along","amble over","amble down the road"],"bs":"He walked slowly and easily across the field.","cs":"He ambled across the field.","f":["ambled","ambling","ambles"],"x":["stroll","saunter","wander"]},
{"t":"wander","m":0,"s":"Movement","b":"walk without a fixed direction","d":"to walk aimlessly or without a definite destination","n":"The key idea is having no destination. Also used of the mind (my thoughts wandered).","p":"/ˈwɒndə/","e":"We wandered through the market with no plan.","c":["wander around","wander off","wander aimlessly"],"bs":"She walked around the city without any plan.","cs":"She wandered around the city.","f":["wandered","wandering","wanders"],"x":["stroll","amble","roam"]},
{"t":"roam","m":0,"s":"Movement","b":"travel over a wide area without a fixed aim","d":"to move about freely over a large area","n":"Bigger scale than wander: countryside, cities, the world. Freedom rather than aimlessness.","p":"/rəʊm/","e":"Wild horses still roam the hills here.","c":["roam the streets","roam freely","roam far and wide"],"bs":"After the exams he travelled around Europe without a fixed plan.","cs":"After the exams he roamed around Europe.","f":["roamed","roaming","roams"],"x":["wander"]},
{"t":"march","m":0,"s":"Movement","b":"walk with firm regular steps","d":"to walk with a regular, determined step, often in anger or purpose","n":"Determination, sometimes anger. Someone who marches into a room means business.","p":"/mɑːtʃ/","e":"She marched into the manager's office and demanded a refund.","c":["march in","march off","march up to someone"],"bs":"He walked firmly and angrily up to the desk.","cs":"He marched up to the desk.","f":["marched","marching","marches"],"x":["stride","storm"]},
{"t":"limp","m":0,"s":"Movement","b":"walk with difficulty because of an injured leg","d":"to walk unevenly because one leg or foot is hurt","n":"Physical injury. Figuratively, something that limps along is barely surviving.","p":"/lɪmp/","e":"He limped off the pitch in the second half.","c":["limp off","limp along","limp home"],"bs":"She walked with difficulty because her ankle was injured.","cs":"She limped because her ankle was injured.","f":["limped","limping","limps"],"x":["hobble"]},

/* =========================================================
   STORAGE (falls back to memory if browser storage is blocked)
   ========================================================= */
const KEY = "sharpen-c1-v1";
let mem = null;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return mem || null;
}
function save(){
  mem = state;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
const today = () => new Date().toISOString().slice(0,10);
function daysAgo(dateStr){
  const a = new Date(dateStr+"T00:00:00"), b = new Date(today()+"T00:00:00");
  return Math.round((b-a)/86400000);
}

let state = load() || {
  items:{},           // term -> {box, due, seen, right, wrong}
  streak:0, lastGoalDay:null, dayPoints:0, dayDate:today(),
  goal:30, voice:"en-GB", totalPoints:0
};
if(state.dayDate !== today()){
  // a new day: keep or reset streak
  if(state.lastGoalDay && daysAgo(state.lastGoalDay) > 1) state.streak = 0;
  state.dayDate = today(); state.dayPoints = 0;
}
save();

const INTERVALS = [0,1,3,7,14,30]; // days until next review, by box
function it(term){ return state.items[term] || (state.items[term] = {box:0,due:today(),seen:0,right:0,wrong:0}); }
function mastery(term){ const s = state.items[term]; return s ? Math.min(s.box,4)/4 : 0; }
function isDue(term){ const s = state.items[term]; return s && s.seen>0 && s.due <= today(); }
function grade(term, ok){
  const s = it(term); s.seen++;
  if(ok){ s.right++; s.box = Math.min(s.box+1, 5); }
  else { s.wrong++; s.box = Math.max(s.box-1, 0); }
  const d = new Date(); d.setDate(d.getDate()+INTERVALS[s.box]);
  s.due = d.toISOString().slice(0,10);
}
function addPoints(n){
  state.totalPoints += n; state.dayPoints += n;
  if(state.dayPoints >= state.goal && state.lastGoalDay !== today()){
    if(state.lastGoalDay && daysAgo(state.lastGoalDay) === 1) state.streak++;
    else state.streak = 1;
    state.lastGoalDay = today();
    toast(`Daily target reached. Streak: ${state.streak} day${state.streak===1?"":"s"}`);
  }
  save();
}

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const forms = item => [item.t, ...(item.f||[])].map(norm);
function contains(answer, item){ const a = " "+norm(answer)+" "; return forms(item).some(f => a.includes(" "+f+" ")); }
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++)d[0][j]=j; for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

const domHue = d => (DOMAINS.find(x=>x[0]===d)||["","#2F5BEA"])[1];
const conceptsOf = term => CONCEPTS.filter(c=>c.w.some(w=>w[0]===term));

function modPct(m){ const items = m==="all" ? DB : DB.filter(x=>x.m===m); return Math.round(items.reduce((s,x)=>s+mastery(x.t),0)/items.length*100); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

/* text-to-speech */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!window.speechSynthesis){ toast("Speech is not supported in this browser"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.voice; u.rate = 0.9;
  const v = (state.voiceName && voices.find(v=>v.name===state.voiceName)) || voices.find(v=>v.lang.replace("_","-")===state.voice) || voices.find(v=>v.lang.startsWith("en"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
window.speak = speak;

function renderConcept(){
  const c = curConcept(); if(!c){ go({name:"home"}); return; }
  const hue = domHue(c.dom);
  const rows = c.w.map(w=>({t:w[0],lvl:w[1],kind:w[2],shade:w[3],item:byTerm[w[0]]}));
  const row = r => `<button class="lrow" onclick="openWord('${esc(r.t).replace(/'/g,"\\'")}')">
      <span class="lv" aria-label="strength ${r.lvl} of 5">${[1,2,3,4,5].map(i=>`<i class="${r.lvl>=i?"on":""}"></i>`).join("")}</span>
      <span class="tx"><b>${esc(r.t)}</b><span>${esc(r.shade)}</span></span>
      <span class="dots">${[1,2,3,4].map(i=>`<span class="dot ${mastery(r.t)*4>=i?"on":""}"></span>`).join("")}</span></button>`;
  let body;
  if(sel.cview==="scale"){
    const sorted = rows.slice().sort((a,b)=>a.lvl-b.lvl);
    body = `<div class="kind">${esc(c.scale)}<small>Weakest at the top, strongest at the bottom</small></div><div class="ladder">${sorted.map(row).join("")}</div>`;
  } else {
    body = Object.entries(c.kinds).map(([k,lab])=>{ const rs = rows.filter(r=>r.kind===k); if(!rs.length) return ""; const [h,...d]=lab.split(": "); return `<div class="kind">${esc(h)}<small>${esc(d.join(": "))}</small></div><div class="ladder">${rs.sort((a,b)=>a.lvl-b.lvl).map(row).join("")}</div>`; }).join("");
  }
  app.innerHTML = `
  <div class="screen">
    <div class="topbar">
      <button class="icon-btn" aria-label="Back" onclick="go({name:'home'})">${ICON.back}</button>
      <div style="flex:1"><div class="sub" style="color:${hue}">${esc(c.dom)}</div><h1 style="font-size:22px">${esc(c.title)}</h1></div>
      <div class="sub">${conceptPct(c)}%</div>
    </div>
    <div class="intro">${esc(c.intro)}</div>
    <div class="ask"><small>Ask yourself</small>${esc(c.ask)}</div>
    <div class="stack" style="margin-bottom:16px">
      <button class="btn" onclick="startConceptPractice()">Which word fits? Practise this concept</button>
      <button class="btn ghost" onclick="startFlash()">Flashcards in order of strength</button>
    </div>
    <div class="seg2"><button class="${sel.cview==="scale"?"on":""}" onclick="setCView('scale')">By strength</button><button class="${sel.cview==="kind"?"on":""}" onclick="setCView('kind')">By kind</button></div>
    ${body}
  </div>`;
}

  return [...due, ...fresh, ...rest].slice(0, Math.min(n, pool.length));
};

window.startPractice = (items, mode) => {
  if(!items.length){ toast("No words in this set yet"); return; }
  const types = mode==="mixed" ? ["convert","recall","choose"] : mode==="concept" ? ["fit","fit","convert","choose","recall"] : [mode];
  const qs = items.map((item,i)=>makeQ(item, types[i%types.length]));
  pr = {qs, i:0, right:0, wrong:0, points:0, results:[], answered:false, choice:null};
  go({name:"practice"});
};
function makeQ(item, type){
  const q = {item, type};
  // find the form of the term actually used in the model sentence (for highlighting and the gap)
  const fs = [item.t, ...(item.f||[])].sort((a,b)=>b.length-a.length);
  q.used = item.t;
  for(const f of fs){ if(new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(item.cs)){ q.used=f; break; } }
  if(type==="choose" || type==="fit"){
    const c = curConcept();
    const okd = x => x!==item && !(item.x||[]).includes(x.t) && !(x.x||[]).includes(item.t);
    const cpool = c ? shuffle(conceptItems(c).filter(okd)) : [];
    const pool = DB.filter(x=>okd(x) && x.m===item.m && !cpool.includes(x));
    const same = shuffle(pool.filter(x=>x.s===item.s)), other = shuffle(pool.filter(x=>x.s!==item.s));
    const ds = [...cpool, ...same, ...other].slice(0,3);
    q.options = shuffle([item, ...ds]);
    q.gap = item.cs.replace(new RegExp("\\b"+q.used.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i"),"____");
  }
  return q;
}

window.check = () => {
  if(pr.answered) return;
  const q = pr.qs[pr.i], item = q.item;
  let ok=false, title="", html="";
  const model = `<div class="model">${esc(item.cs).replace(new RegExp(esc(q.used||item.t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"), m=>`<b>${m}</b>`)}</div>`;
  if(q.type==="convert"){
    const ans = $("#ans").value; if(!norm(ans)) { toast("Type your sentence first"); return; }
    ok = contains(ans, item);
    if(ok){ title="Well put"; html=`<p>You used <b>${esc(item.t)}</b> correctly. ${esc(item.n)}</p>${model}`; }
    else {
      const other = DB.find(x=>x!==item && contains(ans, x));
      html = other
        ? `<p>You used <b>${esc(other.t)}</b>. That means ${esc(other.b)}, and its nuance is: ${esc(other.n)}</p><p>The sentence needs <b>${esc(item.t)}</b>: ${esc(item.n)}</p>${model}`
        : `<p>The word you are looking for is <b>${esc(item.t)}</b> ${esc(item.p)}: ${esc(item.d)}. ${esc(item.n)}</p>${model}`;
      title="Not quite";
    }
    $("#ans").classList.add(ok?"ok":"bad");
  } else if(q.type==="recall"){
    const ans = norm($("#ans").value); if(!ans){ toast("Type the word first"); return; }
    ok = forms(item).includes(ans);
    const close = !ok && lev(ans, norm(item.t)) <= 2;
    if(ok){ title="Correct"; html=`<p><b>${esc(item.t)}</b> ${esc(item.p)}. ${esc(item.n)}</p>${model}`; }
    else if(close){ title="Almost: check the spelling"; html=`<p>The correct spelling is <b>${esc(item.t)}</b> ${esc(item.p)}. You wrote "${esc($("#ans").value)}".</p>${model}`; }
    else { title="Not quite"; const other = DB.find(x=>x!==item && forms(x).includes(ans)); html = (other?`<p><b>${esc(other.t)}</b> means ${esc(other.b)}: ${esc(other.n)}</p>`:"") + `<p>The answer is <b>${esc(item.t)}</b> ${esc(item.p)}. ${esc(item.n)}</p>${model}`; }
    $("#ans").classList.add(ok?"ok":"bad");
  } else {
    const chosen = q.options[pr.choice]; ok = chosen===item;
    document.querySelectorAll(".opt").forEach((el,i)=>{ el.disabled=true; if(q.options[i]===item) el.classList.add("ok"); else if(i===pr.choice) el.classList.add("bad"); });
    const c = curConcept(); const sh = t => { const w = c && c.w.find(w=>w[0]===t); return w ? `${esc(w[3])} (strength ${w[1]} of 5)` : null; };
    if(ok){ title="Correct"; html=`<p><b>${esc(item.t)}</b>: ${sh(item.t)||esc(item.n)}</p>${q.type==="fit"?model:""}`; }
    else { title="Not quite"; html=`<p><b>${esc(chosen.t)}</b> is ${sh(chosen.t)||("used for "+esc(chosen.b)+". "+esc(chosen.n))}</p><p>This situation is <b>${esc(item.t)}</b>: ${sh(item.t)||esc(item.n)}</p>${model}`; }
  }
  pr.answered = true;
  grade(item.t, ok);
  const pts = ok ? 10 : 2; pr.points += pts; addPoints(pts);
  if(ok) pr.right++; else pr.wrong++;
  pr.results.push({item, ok, type:q.type});
  $("#checkBtn").disabled = true;
  showFeedback(ok, title, html);
};

// Keyboard handling for iPhone: size the app to the visible area, remember the keyboard height and reserve it,
// and force the viewport to re-measure after the keyboard closes (standalone iOS apps can otherwise stay shrunk).
(function(){
  const root = document.documentElement;
  const vv = window.visualViewport;
  let maxH = window.innerHeight;
  let kbH = +(localStorage.getItem("sharpen-kb")||0);
  const setRes = () => root.style.setProperty("--kbres", (kbH || Math.round(maxH*0.42)) + "px");
  setRes();
  function upd(){
    if(!vv) return;
    maxH = Math.max(maxH, window.innerHeight);
    const covered = Math.round(maxH - vv.height - vv.offsetTop);
    if(covered > 120 && document.activeElement && document.activeElement.matches && document.activeElement.matches(".field")){
      if(Math.abs(covered - kbH) > 8){ kbH = covered; try{ localStorage.setItem("sharpen-kb", kbH); }catch(e){} setRes(); }
    }
    root.style.setProperty("--vvh", Math.round(vv.height) + "px");
    root.style.setProperty("--kb", Math.max(0, covered) + "px");
    if(vv.offsetTop > 0) window.scrollTo(0,0);
  }
  function heal(){
    root.style.setProperty("--kb", "0px");
    root.style.setProperty("--vvh", "100%");
    if(maxH - window.innerHeight > 4){
      const st = app.scrollTop;
      app.style.display = "none"; void app.offsetHeight; app.style.display = "";
      app.scrollTop = st;
    }
    window.scrollTo(0,0);
    if(vv) upd();
  }
  if(vv){ vv.addEventListener("resize", upd); vv.addEventListener("scroll", upd); upd(); }
  document.addEventListener("focusout", e => { if(e.target.matches && e.target.matches(".field")) setTimeout(heal, 150); });
})();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
